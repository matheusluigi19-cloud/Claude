<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #17323f;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #aurora {
        z-index: 1;
      }
      #capitulo {
        z-index: 2;
      }
      #mergulho {
        z-index: 3;
      }
    </style>
  </head>
  <body>
    <!-- Teaser de suspense da Madame Solara para Reels: 1080x1920, 30 fps, 20 s.
         Cena 1 (aurora): "Uma nova fase. Um novo sol." O sol nasce e a luz toma a tela.
         Cena 2 (capitulo): a Madame Dress cresce, sobre seda creme.
         Cena 3 (mergulho): a maré azul sobe, vem o universo de sol e mar, e fecha em "Aguardem!".
         O nome e o logo completo não aparecem de propósito: só o sol e o monograma. -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="aurora"
        data-composition-id="aurora"
        data-composition-src="compositions/aurora.html"
        data-start="0"
        data-duration="4.9"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="capitulo"
        data-composition-id="capitulo"
        data-composition-src="compositions/capitulo.html"
        data-start="4.45"
        data-duration="5.85"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="mergulho"
        data-composition-id="mergulho"
        data-composition-src="compositions/mergulho.html"
        data-start="9.2"
        data-duration="10.8"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Trilha: "Majestic", de Diego Nava (Mixkit). O trecho começa 1,4 s dentro da faixa
           para o grave entrar aos 9,6 s do vídeo, junto com a maré. Alternativa pronta em
           assets/audio/one-more-dance.mp3 (ver assets/audio/CREDITOS.md). -->
      <audio
        id="musica"
        class="clip"
        data-timeline-role="music"
        src="assets/audio/majestic.mp3"
        data-start="0"
        data-duration="20"
        data-track-index="3"
        data-volume="0.9"
        data-fade-in="0.3"
        data-fade-out="1.6"
      ></audio>
      <!-- Efeitos: um sopro longo com o pico na luz que toma a tela, e um curto na subida da maré. -->
      <audio
        id="sfx-luz"
        class="clip"
        src="assets/sfx/whoosh-cinematic.mp3"
        data-start="1.42"
        data-duration="5.5"
        data-track-index="4"
        data-volume="0.26"
      ></audio>
      <audio
        id="sfx-mare"
        class="clip"
        src="assets/sfx/whoosh.mp3"
        data-start="9.5"
        data-duration="0.57"
        data-track-index="4"
        data-volume="0.35"
      ></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
