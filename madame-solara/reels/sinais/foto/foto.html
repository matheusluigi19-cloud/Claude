<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Não ignore os sinais</title>
    <style>
      @font-face {
        font-family: "Italiana";
        src: url("../assets/fonts/Italiana-Regular.ttf") format("truetype");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1440px;
        overflow: hidden;
        background: #0b5aa6;
      }
      /* Céu da imagem de referência, um pouco menos saturado para chegar perto do azul da marca. */
      #quadro {
        position: relative;
        width: 1080px;
        height: 1440px;
        overflow: hidden;
        background: linear-gradient(180deg, #0b5aa6 0%, #1570be 25%, #2584cf 50%, #3792d6 75%, #58a7df 100%);
      }
      #quadro img {
        position: absolute;
        display: block;
      }
      /* As camadas vêm de uma imagem de 1024 px de largura; 1,0547 leva a 1080. */
      #finas {
        left: 0;
        top: -70px;
        width: 1080px;
      }
      /* As nuvens do rodapé se abrem no centro para o logo ficar sobre o azul. */
      #base {
        left: 0;
        top: 904px;
        width: 1080px;
        -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 12%, transparent 27%, transparent 73%, #000 88%, #000 100%);
        mask-image: linear-gradient(90deg, #000 0%, #000 12%, transparent 27%, transparent 73%, #000 88%, #000 100%);
      }
      #cima {
        left: 251px;
        top: 286px;
        width: 578px;
      }
      #baixo {
        left: 271px;
        top: 709px;
        width: 555px;
      }
      #frase {
        position: absolute;
        left: 0;
        top: 62px;
        width: 1080px;
        text-align: center;
        font-family: "Italiana", serif;
        font-size: 104px;
        line-height: 1.04;
        letter-spacing: 0.05em;
        text-indent: 0.05em;
        text-transform: uppercase;
        color: #fcfdf5;
        text-shadow: 0 2px 22px rgba(0, 52, 120, 0.45);
      }
      /* Logo vertical com o sol dourado e o nome em branco, para se ler sobre o céu. */
      #logo {
        left: 370px;
        top: 1086px;
        width: 340px;
        filter: drop-shadow(0 2px 14px rgba(0, 40, 100, 0.45));
      }
    </style>
  </head>
  <body>
    <div id="quadro">
      <img id="finas" src="../assets/nuvens/nuvens-finas.png" alt="" />
      <img id="base" src="../assets/nuvens/nuvens-base.png" alt="" />
      <img id="cima" src="../assets/nuvens/biquini-cima.png" alt="" />
      <img id="baixo" src="../assets/nuvens/biquini-baixo.png" alt="" />
      <div id="frase">Não ignore<br />os sinais</div>
      <img id="logo" src="../assets/logo-vertical-ceu.svg" alt="Madame Solara, moda praia e resort" />
    </div>
  </body>
</html>
