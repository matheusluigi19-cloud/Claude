<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Não ignore os sinais</title>
    <style>
      @font-face {
        font-family: "Montserrat";
        font-weight: 700;
        src: url("../assets/fonts/montserrat-latin-700-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Montserrat";
        font-weight: 600;
        src: url("../assets/fonts/montserrat-latin-600-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Playfair Display";
        font-weight: 600;
        font-style: normal;
        src: url("../assets/fonts/playfair-display-latin-600-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Playfair Display";
        font-weight: 600;
        font-style: italic;
        src: url("../assets/fonts/playfair-display-latin-600-italic.woff2") format("woff2");
      }
      :root {
        /* Céu da imagem de referência, um pouco menos saturado para chegar perto do azul da marca. */
        --ceu: linear-gradient(180deg, #0b5aa6 0%, #1570be 25%, #2584cf 50%, #3792d6 75%, #58a7df 100%);
        --creme: #fcfdf5;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1440px;
        overflow: hidden;
        background: #0b5aa6;
      }
      #quadro {
        position: relative;
        width: 1080px;
        height: 1440px;
        overflow: hidden;
        background: var(--ceu);
      }
      #quadro img {
        position: absolute;
        display: block;
      }
      /* As camadas vêm de uma imagem de 1024 px de largura; 1,0547 leva a 1080. */
      #finas {
        left: 0;
        top: -70px;
        width: 1080px;
      }
      /* As nuvens do rodapé se abrem no centro para o monograma ficar sobre o azul. */
      #base {
        left: 0;
        top: 904px;
        width: 1080px;
        -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 14%, transparent 30%, transparent 70%, #000 86%, #000 100%);
        mask-image: linear-gradient(90deg, #000 0%, #000 14%, transparent 30%, transparent 70%, #000 86%, #000 100%);
      }
      #cima {
        left: 198px;
        top: 318px;
        width: 683px;
      }
      #baixo {
        left: 222px;
        top: 818px;
        width: 657px;
      }
      #frase {
        position: absolute;
        left: 0;
        top: 72px;
        width: 1080px;
        text-align: center;
        color: var(--creme);
        text-transform: uppercase;
        text-shadow: 0 2px 22px rgba(0, 52, 120, 0.45);
      }
      #frase span {
        display: block;
        white-space: nowrap;
      }
      #marca {
        position: absolute;
        left: 440px;
        top: 1222px;
        width: 200px;
        height: 170px;
        overflow: visible;
        filter: drop-shadow(0 2px 12px rgba(0, 40, 100, 0.5));
      }
      #anel {
        display: none;
      }

      /* Opção 1: sem serifa forte, como na referência. Monograma creme com a estrela dourada. */
      body.op1 #frase {
        font-family: "Montserrat", sans-serif;
        font-weight: 700;
        font-size: 96px;
        line-height: 1.14;
        letter-spacing: 0.02em;
      }

      /* Opção 2: serifa com peso. Monograma todo dourado. */
      body.op2 #frase {
        top: 66px;
        font-family: "Playfair Display", serif;
        font-weight: 600;
        font-size: 98px;
        line-height: 1.14;
        letter-spacing: 0.04em;
      }
      body.op2 #corpo {
        fill: url(#ouro);
      }

      /* Opção 3: uma linha sem serifa e a outra em itálico. Monograma creme, estrela e anel dourados. */
      body.op3 #frase {
        top: 62px;
      }
      body.op3 #l1 {
        font-family: "Montserrat", sans-serif;
        font-weight: 600;
        font-size: 54px;
        line-height: 1.2;
        letter-spacing: 0.3em;
        text-indent: 0.3em;
      }
      body.op3 #l2 {
        font-family: "Playfair Display", serif;
        font-weight: 600;
        font-style: italic;
        font-size: 156px;
        line-height: 1.02;
        text-transform: none;
      }
      body.op3 #anel {
        display: inline;
      }
      body.op3 #marca {
        top: 1206px;
      }
    </style>
  </head>
