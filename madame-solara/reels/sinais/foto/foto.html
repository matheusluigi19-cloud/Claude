<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Não ignore os sinais</title>
    <style>
      @font-face {
        font-family: "Italiana";
        src: url("../assets/fonts/Italiana-Regular.ttf") format("truetype");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1440px;
        overflow: hidden;
        background: #fcfdf5;
      }
      /* O quadro termina em creme: o logo colorido tem letras azuis e só se lê sobre fundo claro. */
      #quadro {
        position: relative;
        width: 1080px;
        height: 1440px;
        overflow: hidden;
        background: #fcfdf5;
      }
      #quadro img {
        position: absolute;
        display: block;
      }
      /* Céu da imagem de referência, um pouco menos saturado para chegar perto do azul da marca. */
      #ceu {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1110px;
        overflow: hidden;
        background: linear-gradient(180deg, #0b5aa6 0%, #1570be 28%, #2584cf 56%, #3d97d9 82%, #62aee2 100%);
      }
      /* As camadas vêm de uma imagem de 1024 px de largura; 1,0547 leva a 1080. */
      #finas {
        left: 0;
        top: -70px;
        width: 1080px;
      }
      /* Perto do horizonte o azul vira névoa e depois o creme da marca. */
      #nevoa {
        position: absolute;
        left: 0;
        top: 930px;
        width: 1080px;
        height: 180px;
        background: linear-gradient(180deg, rgba(252, 253, 245, 0) 0%, rgba(252, 253, 245, 0.55) 45%, #fcfdf5 100%);
      }
      /* Das nuvens do rodapé só aparecem os topos, que se desfazem no creme. */
      #base {
        left: 0;
        top: 868px;
        width: 1080px;
        /* Sem saturação: sobre o creme, a sombra azulada das nuvens puxava para o rosa. */
        filter: saturate(0.12) brightness(1.03);
        -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 31%, transparent 47%);
        mask-image: linear-gradient(180deg, #000 0%, #000 31%, transparent 47%);
      }
      #cima {
        left: 273px;
        top: 292px;
        width: 534px;
      }
      #baixo {
        left: 291px;
        top: 683px;
        width: 514px;
      }
      #frase {
        position: absolute;
        left: 0;
        top: 62px;
        width: 1080px;
        text-align: center;
        font-family: "Italiana", serif;
        font-size: 104px;
        line-height: 1.04;
        letter-spacing: 0.05em;
        text-indent: 0.05em;
        text-transform: uppercase;
        color: #fcfdf5;
        text-shadow: 0 2px 22px rgba(0, 52, 120, 0.45);
      }
      #logo {
        left: 379px;
        top: 1122px;
        width: 322px;
      }
    </style>
  </head>
  <body>
    <div id="quadro">
      <div id="ceu">
        <img id="finas" src="../assets/nuvens/nuvens-finas.png" alt="" />
      </div>
      <div id="nevoa"></div>
      <img id="base" src="../assets/nuvens/nuvens-base.png" alt="" />
      <img id="cima" src="../assets/nuvens/biquini-cima.png" alt="" />
      <img id="baixo" src="../assets/nuvens/biquini-baixo.png" alt="" />
      <div id="frase">Não ignore<br />os sinais</div>
      <img id="logo" src="../assets/logo-vertical-colorido.svg" alt="Madame Solara, moda praia e resort" />
    </div>
  </body>
</html>
