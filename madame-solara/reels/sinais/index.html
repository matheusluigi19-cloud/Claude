<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b5aa6;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!-- "Não ignore os sinais", Madame Solara. Reels 1080x1920, 30 fps, 8 s.
         Um quadro só, com tudo na tela desde o início: frase, biquíni de nuvem e monograma.
         O movimento vem do vento: as nuvens andam e o biquíni se deforma devagar.
         As nuvens são camadas recortadas da imagem de referência enviada pela cliente. -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="ceu"
        data-composition-id="ceu"
        data-composition-src="compositions/ceu.html"
        data-start="0"
        data-duration="8"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Trilha: "Majestic", de Diego Nava (Mixkit), a mesma do teaser anterior. O trecho começa
           11,2 s dentro da faixa, já na parte com batida. Ver assets/audio/CREDITOS.md. -->
      <audio
        id="musica"
        class="clip"
        data-timeline-role="music"
        src="assets/audio/majestic.mp3"
        data-start="0"
        data-duration="8"
        data-track-index="3"
        data-volume="0.9"
        data-fade-in="0.06"
        data-fade-out="1.3"
      ></audio>
      <!-- Brisa bem baixa ao fundo, gerada com o Earshot. -->
      <audio
        id="sfx-brisa"
        class="clip"
        src="assets/sfx/brisa.wav"
        data-start="0"
        data-duration="5"
        data-track-index="4"
        data-volume="0.5"
        data-fade-in="0.6"
        data-fade-out="1.6"
      ></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
