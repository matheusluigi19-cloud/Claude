<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<!-- Camadas transparentes por cima dos vídeos da loja, 1080x1920.
     ?camada=logo  só o logo, embaixo e centralizado
     ?camada=frase só a frase, no alto -->
<style>
  @font-face { font-family: "Montserrat"; src: url("assets/fonts/montserrat-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
  :root { --creme: #fbf6ea; --azul: #4f97b8; --azul-texto: #2c6a86; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; background: transparent; overflow: hidden; }
  .camada { display: none; }
  /* Logo solto (nome branco e sol dourado), pequeno, embaixo e centralizado. */
  #selo-logo { position: absolute; left: 50%; top: 1380px; width: 200px; margin-left: -100px; justify-content: center; }
  #selo-logo img { width: 200px; filter: drop-shadow(0 1px 2px rgba(10, 20, 30, 0.75)) drop-shadow(0 0 12px rgba(10, 20, 30, 0.55)); }
  /* Frase sem fundo, em branco com sombra, no alto do quadro, onde ficam os cabides. */
  #frase { position: absolute; left: 0; right: 0; top: 300px; text-align: center; }
  #frase span { display: inline-block; color: #fffdf7; font-family: "Montserrat", sans-serif; font-weight: 700;
    font-size: 46px; line-height: 62px; letter-spacing: 0.01em;
    text-shadow: 0 1px 3px rgba(10, 20, 30, 0.8), 0 0 18px rgba(10, 20, 30, 0.6), 0 0 36px rgba(10, 20, 30, 0.35); }
</style>
</head>
<body>
  <div class="camada" id="selo-logo"><img src="assets/logo-vertical-ceu.svg" alt="Madame Solara"></div>
  <div class="camada" id="frase"><span>venha conferir as nossas peças<br>na Madame Dress</span></div>
<script>
  const c = new URLSearchParams(location.search).get("camada");
  const el = document.getElementById(c === "frase" ? "frase" : "selo-logo");
  el.style.display = c === "frase" ? "block" : "flex";
</script>
</body>
</html>
