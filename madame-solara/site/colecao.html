<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coleção · Madame Solara</title>
  <link rel="icon" href="assets/monograma-dourado.svg">
  <link rel="stylesheet" href="estilo.css">
</head>
<body data-pagina="colecao">
  <main id="conteudo" class="pagina">
    <div class="pagina__titulo">
      <h1>Coleção</h1>
      <div class="filtros" role="group" aria-label="Filtrar por categoria">
        <button type="button" data-filtro="todos" aria-pressed="true">Todos</button>
        <button type="button" data-filtro="biquinis" aria-pressed="false">Biquínis</button>
        <button type="button" data-filtro="maios" aria-pressed="false">Maiôs</button>
        <button type="button" data-filtro="resort" aria-pressed="false">Resort</button>
      </div>
    </div>
    <ul class="grade"></ul>
  </main>
  <script src="produtos.js"></script>
  <script src="loja.js"></script>
</body>
</html>
